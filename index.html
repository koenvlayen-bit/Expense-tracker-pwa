<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triply">
<meta name="description" content="Triply — reiskosten bijhouden, delen en verdelen.">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>Triply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#14b8a6;--teal2:#2dd4bf;--teal-dk:#0f766e;--teal-xl:#ccfbf1;
  --navy:#0f172a;--navy2:#1e293b;--navy3:#334155;
  --sand:#ffe7b3;--coral:#f87171;--coral-dk:#dc2626;
  --light:#f0f9f7;--card:#ffffff;--line:#e2e8f0;--line2:#f1f5f9;--field:#f8fafc;
  --text:#0f172a;--dim:#64748b;--dim2:#94a3b8;
  --r:16px;--r-lg:24px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  --shadow:0 4px 20px rgba(15,23,42,.08);
}
html,body{height:100%;background:var(--light);overscroll-behavior:none}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--text);font-size:14px;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
svg.i.s16{width:16px;height:16px}svg.i.s18{width:18px;height:18px}svg.i.s24{width:24px;height:24px}svg.i.s28{width:28px;height:28px}
.hidden{display:none!important}

/* ── layout ── */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{display:none;flex-direction:column;flex:1;min-height:0}
.view.active{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.wrap{max-width:640px;margin:0 auto;width:100%}

/* ── header (home) ── */
.top{background:linear-gradient(140deg,var(--navy) 0%,#0f2a2a 58%,var(--teal-dk) 100%);color:#fff;padding:calc(18px + var(--safe-top)) 20px 26px;position:relative;overflow:hidden;flex-shrink:0}
.top .palm-bg{position:absolute;right:-28px;bottom:-34px;width:170px;height:170px;opacity:.09;color:var(--teal2)}
.top-row{display:flex;align-items:center;justify-content:space-between;position:relative}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal-dk));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(20,184,166,.4)}
.brand-name{font-size:22px;font-weight:800;letter-spacing:-.3px}
.top-actions{display:flex;gap:8px}
.ibtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff}
.ibtn:active{transform:scale(.92)}
.hello{margin-top:22px;position:relative}
.hello-sm{font-size:12px;font-weight:600;color:var(--teal2);letter-spacing:1.2px;text-transform:uppercase}
.hello-lg{font-size:26px;font-weight:700;margin-top:2px;line-height:1.2}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);margin-top:12px}
.pill.warn{background:rgba(255,231,179,.18);border-color:rgba(255,231,179,.4);color:var(--sand)}

/* ── home content ── */
.home-body{padding:16px 16px calc(110px + var(--safe-bot))}
.now-card{background:#fff;border-radius:var(--r-lg);padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);margin:-34px 0 18px;position:relative;cursor:pointer;border:1.5px solid var(--teal-xl)}
.now-ico{width:48px;height:48px;border-radius:14px;background:var(--teal-xl);color:var(--teal-dk);display:flex;align-items:center;justify-content:center}
.now-txt{flex:1;min-width:0}
.now-lbl{font-size:10px;font-weight:700;color:var(--teal-dk);letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(20,184,166,.25);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(20,184,166,0)}}
.now-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-sub{font-size:12px;color:var(--dim)}
.sec{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:6px 2px 12px;display:flex;justify-content:space-between;align-items:center}
.trip-card{border-radius:var(--r-lg);margin-bottom:14px;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 6px 22px rgba(15,23,42,.14);min-height:168px;display:flex;color:#fff}
.trip-card:active{transform:scale(.985);transition:transform .1s}
.tc-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.tc-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(2,6,23,.78) 0%,rgba(2,6,23,.15) 62%,rgba(2,6,23,.05))}
.tc-in{position:relative;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;flex:1}
.tc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.glass{background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.glass.sand{background:rgba(255,231,179,.22);border-color:rgba(255,231,179,.45);color:var(--sand)}
.tc-ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tc-name{font-size:21px;font-weight:700;line-height:1.2;margin-top:28px}
.tc-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;opacity:.88;margin-top:4px}
.tc-meta span{display:inline-flex;align-items:center;gap:5px}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--sand);transition:width .5s}
.bar.over>i{background:var(--coral)}
.bar-txt{display:flex;justify-content:space-between;font-size:10px;opacity:.8;margin-top:4px}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.9);margin-left:-7px;flex-shrink:0;text-transform:uppercase}
.avs .av:first-child{margin-left:0}
.av.lg{width:38px;height:38px;font-size:14px;border:none;margin:0}
.av.md{width:30px;height:30px;font-size:12px;border:none;margin:0}
.av.off{opacity:.55}

/* ── empty ── */
.empty{text-align:center;padding:56px 28px;color:var(--dim)}
.empty .e-ico{width:76px;height:76px;border-radius:24px;margin:0 auto 16px;background:var(--teal-xl);color:var(--teal-dk);display:flex;align-items:center;justify-content:center}
.empty h3{font-size:17px;color:var(--navy);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.6}

/* ── FAB ── */
.fab{position:fixed;right:20px;bottom:calc(22px + var(--safe-bot));width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,var(--teal),var(--teal-dk));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(20,184,166,.5);z-index:20}
.fab:active{transform:scale(.92)}

/* ── trip view ── */
.hero{position:relative;height:calc(208px + var(--safe-top));flex-shrink:0;color:#fff;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(2,6,23,.92) 0%,rgba(2,6,23,.3) 55%,rgba(2,6,23,.35) 100%)}
.hero-bar{position:absolute;top:calc(12px + var(--safe-top));left:14px;right:14px;display:flex;justify-content:space-between}
.hero-bar .ibtn{background:rgba(15,23,42,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero-in{position:absolute;left:20px;right:20px;bottom:16px}
.hero-name{font-size:25px;font-weight:700;line-height:1.15;display:flex;align-items:center;gap:10px}
.hero-sub{font-size:12px;opacity:.85;margin-top:6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-sub span{display:inline-flex;align-items:center;gap:5px}
.sum{margin:-14px 16px 0;position:relative;z-index:2;border-radius:var(--r-lg);padding:16px 18px;color:#fff;background:linear-gradient(135deg,var(--teal-dk),var(--teal));box-shadow:0 10px 26px rgba(15,118,110,.3)}
.sum.plain{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.sum-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sum-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.sum-big{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.sum-big.neg{color:#fecaca}
.sum-side{text-align:right;font-size:12px;opacity:.85}
.sum .bar{background:rgba(255,255,255,.25);height:6px}
.sum .bar>i{background:#fff}
.sum .bar.over>i{background:#fecaca}
.sum-foot{display:flex;justify-content:space-between;gap:8px;font-size:11px;opacity:.85;margin-top:6px;flex-wrap:wrap}
.sum.plain .sum-lbl,.sum.plain .sum-side,.sum.plain .sum-foot{color:var(--dim);opacity:1}
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini{background:rgba(255,255,255,.15);border-radius:12px;padding:8px 10px}
.sum.plain .mini{background:var(--field)}
.mini b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{font-size:10px;opacity:.8;text-transform:uppercase;letter-spacing:.5px;font-weight:600}

.tabs{display:flex;gap:4px;background:#e6efed;border-radius:14px;padding:4px;margin:14px 16px 4px;flex-shrink:0}
.tab{flex:1;padding:9px 6px;border-radius:10px;font-size:12px;font-weight:600;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{background:#fff;color:var(--teal-dk);box-shadow:0 2px 8px rgba(15,23,42,.08)}
.pane{padding:8px 16px calc(110px + var(--safe-bot))}

/* ── expenses ── */
.filters{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:7px 12px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:12px;font-weight:600;color:var(--navy3)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.teal.on{background:var(--teal);border-color:var(--teal)}
.searchbox{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;margin:4px 0 6px;color:var(--dim)}
.searchbox input{border:none;outline:none;background:none;flex:1;color:var(--navy)}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 6px;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.day b{color:var(--navy);font-weight:700;letter-spacing:0;text-transform:none;font-size:12px}
.list{background:#fff;border-radius:var(--r);box-shadow:0 2px 10px rgba(15,23,42,.04);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.row:last-child{border-bottom:none}
.row:active{background:var(--field)}
.cico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-mid{flex:1;min-width:0}
.row-t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:2px;white-space:nowrap;overflow:hidden}
.row-s .av{width:16px;height:16px;font-size:8px;border:none;margin:0}
.row-r{text-align:right;flex-shrink:0}
.row-amt{font-size:15px;font-weight:700}
.row-org{font-size:10px;color:var(--dim)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--line2);color:var(--dim)}
.tag.pend{background:#fef3c7;color:#b45309}
.tag.tr{background:var(--teal-xl);color:var(--teal-dk)}

/* ── insights ── */
.card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.04);margin-bottom:12px}
.card h4{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:132px;height:132px;flex-shrink:0}
.donut svg{width:132px;height:132px;transform:rotate(-90deg)}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-c b{font-size:15px;font-weight:700}
.donut-c small{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.lg-row{display:flex;align-items:center;gap:8px;font-size:12px}
.lg-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.lg-row span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-row b{font-weight:700}
.cat-bars .cb{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cb-mid{flex:1;min-width:0}
.cb-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.cb-top span:last-child{color:var(--dim);font-weight:500}
.track{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.track>i{display:block;height:100%;border-radius:99px}
.dscroll{overflow-x:auto;scrollbar-width:none;padding-top:6px}
.dscroll::-webkit-scrollbar{display:none}
.days{display:flex;align-items:flex-end;gap:4px;height:130px;position:relative}
.dcol{flex:1 0 14px;height:100%;display:flex;align-items:flex-end;justify-content:center}
.dbar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(to top,var(--teal-dk),var(--teal2));min-height:3px}
.dbar.over{background:linear-gradient(to top,var(--coral-dk),var(--coral))}
.dbar.zero{background:var(--line)}
.dlbls{display:flex;gap:4px;margin-top:5px}
.dlbl{flex:1 0 14px;text-align:center;font-size:9px;color:var(--dim2);font-weight:600}
.dlbl.today{color:var(--teal-dk);font-weight:800}
.bline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--coral);pointer-events:none;z-index:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:var(--r);padding:14px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.kpi-i{width:30px;height:30px;border-radius:9px;background:var(--teal-xl);color:var(--teal-dk);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.kpi b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{font-size:11px;color:var(--dim)}

/* ── split ── */
.bal{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.bal:last-child{border-bottom:none}
.bal-mid{flex:1;min-width:0}
.bal-n{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.bal-s{font-size:11px;color:var(--dim)}
.bal-v{font-weight:700;font-size:15px;text-align:right}
.pos{color:var(--teal-dk)}.neg{color:var(--coral-dk)}
.settle{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.settle:last-child{border-bottom:none}
.settle-t{flex:1;font-size:13px;min-width:0}
.settle-t b{font-weight:700}
.arrow{color:var(--dim2);display:inline-flex;vertical-align:middle;margin:0 2px}
.sbtn{font-size:12px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--teal-xl);color:var(--teal-dk);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.sbtn.dark{background:var(--navy);color:#fff}
.sbtn.danger{background:#fee2e2;color:var(--coral-dk)}
.sbtn:active{transform:scale(.96)}
.invite{background:linear-gradient(135deg,var(--navy),#123236);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}
.invite h4{color:var(--teal2)}
.code-big{font-size:22px;font-weight:800;letter-spacing:3px;font-variant-numeric:tabular-nums}
.inv-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.inv-btns .sbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)}
.qr{background:#fff;border-radius:14px;padding:12px;display:inline-block;margin-top:12px}
.qr img,.qr canvas{display:block}
.ok-line{display:flex;align-items:center;gap:8px;color:var(--teal-dk);font-weight:600;font-size:13px;padding:6px 0}

/* ── sheets ── */
.layer{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.layer.open{display:flex;animation:fade .2s}
.layer.top{z-index:150}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:28px 28px 0 0;max-height:94vh;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.34,1.4,.64,1)}
@keyframes up{from{transform:translateY(100%)}}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line2);flex-shrink:0;position:relative}
.sh-h::before{content:'';position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;background:var(--line);border-radius:99px}
.sh-h h2{flex:1;font-size:17px;font-weight:700;text-align:center;margin-top:6px}
.sh-x{width:34px;height:34px;border-radius:50%;background:var(--line2);display:flex;align-items:center;justify-content:center;color:var(--navy);margin-top:6px}
.sh-sp{width:34px}
.sh-b{padding:18px 18px calc(22px + var(--safe-bot));overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-b::-webkit-scrollbar{display:none}
.dlg{background:#fff;border-radius:24px;margin:auto 18px;max-width:400px;width:100%;padding:22px;animation:pop .22s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.layer.center{align-items:center}
.dlg h3{font-size:17px;margin-bottom:6px}
.dlg p{font-size:13px;color:var(--dim);line-height:1.6}
.dlg-btns{display:flex;gap:8px;margin-top:18px}
.dlg-btns button{flex:1}

/* ── forms ── */
.lbl{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--dim);text-transform:uppercase;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.grp{margin-bottom:18px}
.field{display:flex;align-items:center;gap:10px;background:var(--field);border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px;color:var(--dim);transition:border-color .2s}
.field:focus-within{border-color:var(--teal);background:#fff}
.field input,.field select{flex:1;min-width:0;border:none;outline:none;background:none;color:var(--navy);padding:13px 0;font-size:15px;-webkit-appearance:none;appearance:none}
.field select{cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:15px;border-radius:var(--r);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--teal),var(--teal-dk));color:#fff;box-shadow:0 6px 16px rgba(20,184,166,.35)}
.btn:active{transform:scale(.98);opacity:.92}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--line2);color:var(--navy);box-shadow:none}
.btn.danger{background:#fee2e2;color:var(--coral-dk);box-shadow:none}
.btn.dark{background:var(--navy);box-shadow:none}
.btn+.btn{margin-top:10px}
.link{color:var(--teal-dk);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.hint{font-size:12px;color:var(--dim);line-height:1.55;margin-top:6px}
.photo-pick{height:120px;border:2px dashed var(--teal);border-radius:var(--r);background:rgba(20,184,166,.05) center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--teal-dk);font-size:13px;font-weight:600;margin-bottom:18px;position:relative;overflow:hidden}
.photo-pick.has{border-style:solid;color:#fff}
.photo-pick.has::after{content:'';position:absolute;inset:0;background:rgba(2,6,23,.25)}
.photo-pick>*{position:relative;z-index:1}
.icons-pick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ip{aspect-ratio:1;border-radius:12px;background:var(--field);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy3)}
.ip.on{background:var(--teal-xl);border-color:var(--teal);color:var(--teal-dk)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;background:var(--field);border:1.5px solid var(--line);border-radius:var(--r);cursor:pointer}
.toggle-t{font-size:14px;font-weight:600}
.toggle-s{font-size:11px;color:var(--dim)}
.sw{width:44px;height:26px;border-radius:99px;background:#cbd5e1;position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--teal)}.sw.on::after{left:21px}
.seg{display:flex;background:var(--line2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--dim)}
.seg button.on{background:#fff;color:var(--teal-dk);box-shadow:0 1px 4px rgba(15,23,42,.1)}

/* ── expense sheet ── */
.amt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 12px}
.amt-cur{display:flex;align-items:center;gap:6px;background:var(--teal-xl);color:var(--teal-dk);font-weight:700;padding:8px 10px 8px 12px;border-radius:12px;font-size:14px;position:relative}
.amt-cur select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.amt-val{font-size:46px;font-weight:700;letter-spacing:-1.5px;text-align:right;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.amt-val.zero{color:var(--dim2)}
.conv{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--field);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--dim);margin-bottom:12px}
.conv input{width:84px;border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;text-align:right;background:#fff;color:var(--navy);font-weight:600}
.conv b{color:var(--navy)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}
.key{height:52px;border-radius:14px;background:var(--field);border:1.5px solid var(--line);font-size:21px;font-weight:600;color:var(--navy);display:flex;align-items:center;justify-content:center}
.key:active{background:var(--teal-xl);border-color:var(--teal);transform:scale(.95)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 7px;border-radius:14px;border:1.5px solid transparent;font-size:10px;font-weight:600;color:var(--dim);text-align:center;line-height:1.2}
.cat .cico{width:38px;height:38px;border-radius:12px}
.cat.on{border-color:var(--teal);background:rgba(20,184,166,.07);color:var(--teal-dk)}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.pp{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--navy3)}
.pp .av{width:24px;height:24px;font-size:10px;border:none;margin:0}
.pp.on{border-color:var(--teal);background:var(--teal-xl);color:var(--teal-dk)}
.pp .w{display:inline-flex;align-items:center;gap:4px;margin-left:2px}
.pp .w button{width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--teal);color:var(--teal-dk);font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;font-size:13px}
.split-sum{font-size:11px;color:var(--dim);margin-top:8px}
.rcpt{display:flex;align-items:center;gap:10px}
.rcpt-th{width:56px;height:56px;border-radius:12px;background:var(--field) center/cover;border:1.5px solid var(--line)}

/* ── onboarding ── */
.onb{position:fixed;inset:0;z-index:90;background:linear-gradient(150deg,#0f172a 0%,#0f2a2a 55%,#0f766e 100%);color:#fff;overflow-y:auto;display:flex;flex-direction:column}
.onb-in{max-width:420px;margin:0 auto;width:100%;padding:calc(28px + var(--safe-top)) 26px calc(28px + var(--safe-bot));flex:1;display:flex;flex-direction:column}
.onb .palm-bg{position:fixed;right:-60px;bottom:-60px;width:300px;height:300px;opacity:.07;color:var(--teal2);pointer-events:none}
.onb-top{display:flex;justify-content:flex-end}
.lang-seg{display:flex;background:rgba(255,255,255,.1);border-radius:99px;padding:3px;border:1px solid rgba(255,255,255,.15)}
.lang-seg button{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;color:rgba(255,255,255,.6)}
.lang-seg button.on{background:#fff;color:var(--navy)}
.onb-logo{margin:44px 0 18px;width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--teal),var(--teal-dk));display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(20,184,166,.45)}
.onb h1{font-size:38px;font-weight:800;letter-spacing:-1px}
.onb .tag-l{font-size:14px;color:rgba(255,255,255,.6);margin:4px 0 34px}
.onb .lbl{color:rgba(255,255,255,.6)}
.onb .field{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.5)}
.onb .field:focus-within{background:rgba(255,255,255,.12);border-color:var(--teal2)}
.onb .field input,.onb .field select{color:#fff}
.onb .field select option{color:var(--navy)}
.onb .field input::placeholder{color:rgba(255,255,255,.35)}
.onb .link{color:var(--teal2)}
.onb .hint{color:rgba(255,255,255,.5)}
.onb-alt{margin-top:auto;padding-top:26px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.feat{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;font-size:13px;color:rgba(255,255,255,.75)}
.feat i{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--teal2);flex-shrink:0}
.feat b{color:#fff;display:block;font-size:13px}
.key-box{background:var(--navy);color:#fff;border-radius:var(--r);padding:16px 10px;text-align:center;font-size:clamp(13px,4.3vw,18px);font-weight:800;letter-spacing:.5px;white-space:nowrap;font-variant-numeric:tabular-nums;word-break:break-all;margin:12px 0}

/* ── settings ── */
.set-list{background:var(--field);border-radius:var(--r);border:1.5px solid var(--line);overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-ico{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--navy3);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.set-mid{flex:1;min-width:0}
.set-t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.set-s{font-size:11px;color:var(--dim)}
.badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 6px;border-radius:6px;background:var(--teal-xl);color:var(--teal-dk)}
.foot{text-align:center;color:var(--dim);font-size:11px;margin-top:22px}
.foot .brand-mark{margin:0 auto 6px;width:34px;height:34px;border-radius:10px}

/* ── toast & spinner ── */
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-top));transform:translateX(-50%);z-index:300;background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(2,6,23,.3);max-width:calc(100% - 32px);animation:drop .25s}
.toast.err{background:var(--coral-dk)}
.toast.ok{background:var(--teal-dk)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.spin{width:26px;height:26px;border:3px solid rgba(20,184,166,.2);border-top-color:var(--teal);border-radius:50%;animation:rot .7s linear infinite;margin:40px auto}
@keyframes rot{to{transform:rotate(360deg)}}
@media (min-width:700px){.fab{right:calc(50% - 300px)}}
</style>
</head>

const parseDay = s => { const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); };
const dayDiff = (a,b) => Math.round((parseDay(b)-parseDay(a))/864e5);
function addDays(s,n){ const d=parseDay(s); d.setDate(d.getDate()+n); return isoDay(d); }
const fmtDate = (s, o={day:'numeric',month:'short'}) => parseDay(s).toLocaleDateString(LOC(), o);
function fmtRange(a,b){ if(!a) return ''; if(!b||a===b) return fmtDate(a,{day:'numeric',month:'short',year:'numeric'});
  const sameY = a.slice(0,4)===b.slice(0,4); return fmtDate(a, sameY?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'})+' – '+fmtDate(b,{day:'numeric',month:'short',year:'numeric'}); }
function relTime(ts){ if(!ts) return '–'; const m=(Date.now()-new Date(ts))/6e4;
  if(m<2) return LANG==='nl'?'net nu':'just now'; if(m<60) return Math.round(m)+' min';
  if(m<1440) return Math.round(m/60)+(LANG==='nl'?' u':' h'); return new Date(ts).toLocaleDateString(LOC(),{day:'numeric',month:'short'}); }
const initials = n => (String(n||'?').trim()[0]||'?');
const av = (m, cls='') => `<span class="av ${cls}${m&&m.has_access===false?' off':''}" style="background:${esc(m?.color||'#94a3b8')}">${esc(initials(m?.name))}</span>`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const buzz = () => { try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} };
const deviceLabel = () => { const u=navigator.userAgent; return /iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows':'Browser'; };

/* ── toast ── */
let toastT;
function toast(msg, kind='ok'){
  clearTimeout(toastT); document.querySelectorAll('.toast').forEach(x=>x.remove());
  const el=document.createElement('div'); el.className='toast '+kind;
  el.innerHTML=ic(kind==='err'?'i-offline':'i-check','s16')+'<span>'+esc(msg)+'</span>';
  document.body.appendChild(el); toastT=setTimeout(()=>el.remove(), 2600);
}

/* ── API ── */
class ApiErr extends Error{ constructor(status,detail,network=false){ super(detail); this.status=status; this.detail=detail; this.network=network; } }
let TOKEN = LS.raw('triply_token');
async function api(path, {method='GET', body, auth=true, quiet=false}={}){
  let res;
  try{
    res = await fetch(API+path, { method, headers: { 'Content-Type':'application/json', ...(auth&&TOKEN?{Authorization:'Bearer '+TOKEN}:{}) },
      body: body!==undefined ? JSON.stringify(body) : undefined, cache:'no-store' });
  }catch(e){ setOnline(false); throw new ApiErr(0, t('net_err'), true); }
  setOnline(true);
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok){
    if(res.status===401 && auth){ sessionGone(); throw new ApiErr(401, t('session_gone')); }
    let d = data && data.detail; if(typeof d!=='string') d=null;
    const msg = (LANG==='nl' && d) ? d : t('err')+' ('+res.status+')';
    if(!quiet) toast(msg,'err');
    throw new ApiErr(res.status, msg);
  }
  return data;
}
function sessionGone(){ if(!TOKEN) return; TOKEN=null; LS.del('triply_token'); toast(t('session_gone'),'err'); setTimeout(()=>location.reload(),1200); }

/* ── wisselkoersen (ECB via Frankfurter) ── */
const RATES = LS.get('triply_rates', {});
async function loadRates(base){
  const c = RATES[base]; if(c && Date.now()-c.ts < 6*3600e3) return c.rates;
  for(const url of ['https://api.frankfurter.dev/v1/latest?base='+base, 'https://api.frankfurter.app/latest?from='+base]){
    try{ const r=await fetch(url); if(!r.ok) continue; const j=await r.json();
      if(j && j.rates){ RATES[base]={ts:Date.now(), rates:j.rates}; LS.set('triply_rates', RATES); return j.rates; } }catch(e){}
  }
  return c ? c.rates : null;
}
// koers: hoeveel reismunt voor 1 eenheid 'cur'
async function rateFor(cur, tripCur){ if(cur===tripCur) return 1; const r=await loadRates(tripCur); return r && r[cur] ? +(1/r[cur]).toFixed(6) : null; }

/* ── foto's comprimeren ── */
function pickImage(max, q){
  return new Promise(res=>{
    const inp=$('file-in'); inp.value=''; inp.onchange=()=>{
      const f=inp.files[0]; if(!f) return res(null);
      const url=URL.createObjectURL(f), img=new Image();
      img.onload=()=>{ let w=img.width,h=img.height; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
        const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q)); };
      img.onerror=()=>res(null); img.src=url;
    }; inp.click();
  });
}

function tripStatus(tr){
  const td=today();
  if(tr.start_date && tr.end_date && tr.start_date<=td && td<=tr.end_date) return {k:'now', day:dayDiff(tr.start_date,td)+1, days:dayDiff(tr.start_date,tr.end_date)+1};
  if(tr.start_date && tr.start_date>td) return {k:'soon', n:dayDiff(td,tr.start_date)};
  return {k:'past'};
}
function tripBg(tr, idx){ if(tr.photo) return `background-image:url('${esc(tr.photo)}')`; const g=GRADS[Math.abs(hash(tr.id||String(idx)))%GRADS.length]; return `background:linear-gradient(135deg,${g[0]},${g[1]})`; }
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return h; }
function expCount(n){ n=Number(n)||0; return n===1?t('expense_1'):t('expenses_n',{n}); }

async function openTrip(id){
  S.tab='exp'; S.filter='all'; S.q=''; S.showSearch=false;
  const cached = LS.get('c_trip_'+id) || (S.trips||[]).find(x=>x.id===id);
  S.trip = cached ? {members:[], ...cached} : null; S.exps = LS.get('c_exp_'+id, []);
  history.replaceState(null,'','?trip='+encodeURIComponent(id));
  switchView('v-trip'); $('trip-scroll').scrollTop=0;
  if(S.trip) renderTrip(); else $('pane').innerHTML='<div class="spin"></div>';
  await refreshTrip(id);
}
async function refreshTrip(id){
  id = id || (S.trip && S.trip.id); if(!id) return;
  try{
    const [tr, ex] = await Promise.all([api('/api/trips/'+id,{quiet:true}), api('/api/trips/'+id+'/expenses',{quiet:true})]);
    if(S.trip && S.trip.id!==id && $('v-trip').classList.contains('active') && S.trip.id) return;
    S.trip=tr; S.exps=ex; LS.set('c_trip_'+id, tr); LS.set('c_exp_'+id, ex);
    const i=S.trips.findIndex(x=>x.id===id); if(i>=0){ S.trips[i]={...S.trips[i], ...tr}; LS.set('c_trips',S.trips); }
    renderTrip();
  }catch(e){
    if(e.status===404){ LS.del('c_trip_'+id); S.trips=S.trips.filter(x=>x.id!==id); LS.set('c_trips',S.trips); toast(t('err'),'err'); goHome(); }
    else if(!S.trip){ toast(t('net_err'),'err'); goHome(); }
  }
}

/* ── verdelen: rekenwerk ── */
function shareOf(e, mid){ const sp=e.split||{[e.paid_by]:1}; const W=Object.values(sp).reduce((a,b)=>a+Number(b),0)||1; return sp[mid]?Number(e.amount_trip)*Number(sp[mid])/W:0; }
function balances(exps){
  const b={}; (S.trip.members||[]).forEach(m=>b[m.id]={paid:0,share:0,bal:0});
  exps.forEach(e=>{ const amt=Number(e.amount_trip), sp=e.split||{[e.paid_by]:1}, W=Object.values(sp).reduce((a,x)=>a+Number(x),0)||1;
    if(b[e.paid_by]){ b[e.paid_by].bal+=amt; if(!e.is_transfer) b[e.paid_by].paid+=amt; }
    for(const k in sp){ if(!b[k]) continue; const s=amt*Number(sp[k])/W; b[k].bal-=s; if(!e.is_transfer) b[k].share+=s; } });
  return b;
}
function settlements(b){
  const cr=[], db=[];
  for(const id in b){ const v=Math.round(b[id].bal*100)/100; if(v>0.009) cr.push([id,v]); else if(v<-0.009) db.push([id,-v]); }
  cr.sort((a,b)=>b[1]-a[1]); db.sort((a,b)=>b[1]-a[1]); const out=[]; let i=0,j=0;
  while(i<db.length && j<cr.length){ const x=Math.min(db[i][1],cr[j][1]); out.push({from:db[i][0],to:cr[j][0],amt:Math.round(x*100)/100});
    db[i][1]-=x; cr[j][1]-=x; if(db[i][1]<0.01) i++; if(cr[j][1]<0.01) j++; }
  return out;
}

/* ── inzicht ── */
function tripDays(spend){
  const tr=S.trip; let a=tr.start_date, b=tr.end_date;
  const ds=spend.map(e=>String(e.date).slice(0,10)).sort();
  if(!a) a=ds[0]; if(!b) b=ds[ds.length-1];
  if(!a||!b) return [];
  if(b>today() && a<=today() && tr.end_date) {} // volledige reis tonen
  const out=[]; for(let d=a; d<=b && out.length<120; d=addDays(d,1)) out.push(d); return out;
}
function elapsedDays(spend){
  const tr=S.trip, days=tripDays(spend), ds=new Set(spend.map(e=>String(e.date).slice(0,10)));
  if(tr.start_date && tr.start_date<=today()) return Math.max(1, Math.min(days.length||1, dayDiff(tr.start_date, today())+1));
  return Math.max(1, ds.size);
}
function renderInsights(spend, mm){
  const tr=S.trip, cur=tr.currency;
  if(!spend.length){ $('pane').innerHTML=`<div class="empty"><div class="e-ico">${ic('i-pie','s28')}</div><h3>${t('no_exp')}</h3><p>${t('no_exp_s')}</p></div>`; return; }
  const total=spend.reduce((s,e)=>s+Number(e.amount_trip),0);
  const bycat={}; spend.forEach(e=>bycat[e.category]=(bycat[e.category]||0)+Number(e.amount_trip));
  const cats=Object.entries(bycat).sort((a,b)=>b[1]-a[1]);
  const days=tripDays(spend), byday={}; spend.forEach(e=>{ const d=String(e.date).slice(0,10); byday[d]=(byday[d]||0)+Number(e.amount_trip); });
  const spentDays=[...new Set(spend.map(e=>String(e.date).slice(0,10)))];
  const elapsed = elapsedDays(spend);
  const big=spend.reduce((m,e)=>Number(e.amount_trip)>Number(m.amount_trip)?e:m, spend[0]);
  // donut
  const R=54, C=2*Math.PI*R; let off=0;
  const segs=cats.map(([c,v])=>{ const len=v/total*C, s=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${getCat(c).color}" stroke-width="16" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}"/>`; off+=len; return s; }).join('');
  let h=`<div class="kpis">
    <div class="kpi"><div class="kpi-i">${ic('i-trend','s16')}</div><b>${fmt(total/Math.max(1,elapsed),cur)}</b><small>${t('avg_day')}</small></div>
    <div class="kpi"><div class="kpi-i">${ic('c-'+getCat(big.category).id,'s16')}</div><b>${fmt(big.amount_trip,cur)}</b><small>${t('biggest')}${big.note?' · '+esc(big.note):''}</small></div>
    <div class="kpi"><div class="kpi-i">${ic('i-cal','s16')}</div><b>${days.length||spentDays.length}</b><small>${t('days_n')}</small></div>
    <div class="kpi"><div class="kpi-i">${ic('c-'+cats[0][0],'s16')}</div><b>${esc(catName(cats[0][0]))}</b><small>${t('top_cat')} · ${Math.round(cats[0][1]/total*100)}%</small></div></div>`;
  h+=`<div class="card"><h4>${t('by_cat')}</h4><div class="donut-wrap"><div class="donut"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="#f1f5f9" stroke-width="16"/>${segs}</svg><div class="donut-c"><b>${fmt(total,cur)}</b><small>${t('total')}</small></div></div>
    <div class="legend">${cats.slice(0,6).map(([c,v])=>`<div class="lg-row"><i class="lg-dot" style="background:${getCat(c).color}"></i><span>${esc(catName(c))}</span><b>${Math.round(v/total*100)}%</b></div>`).join('')}</div></div>
    <div class="cat-bars" style="margin-top:18px">${cats.map(([c,v])=>{ const cat=getCat(c); return `<div class="cb"><div class="cico" style="width:36px;height:36px;border-radius:11px;background:${cat.color}1f;color:${cat.color}">${ic('c-'+c,'s16')}</div><div class="cb-mid"><div class="cb-top"><span>${esc(catName(c))}</span><span>${fmt(v,cur)}</span></div><div class="track"><i style="width:${v/cats[0][1]*100}%;background:${cat.color}"></i></div></div></div>`; }).join('')}</div></div>`;
  if(days.length>1){
    const budgetDay = tr.budget && days.length ? Number(tr.budget)/days.length : 0;
    const max=Math.max(...days.map(d=>byday[d]||0), budgetDay)*1.08||1;
    h+=`<div class="card"><h4><span>${t('by_day')}</span>${budgetDay?`<span style="color:var(--coral-dk);text-transform:none;letter-spacing:0">- - ${fmt(budgetDay,cur)} ${t('budget_day')}</span>`:''}</h4><div class="dscroll"><div style="min-width:${days.length*18}px"><div class="days">
      ${budgetDay?`<div class="bline" style="bottom:${budgetDay/max*100}%"></div>`:''}
      ${days.map(d=>{ const v=byday[d]||0; return `<div class="dcol" title="${fmtDate(d)} · ${fmt(v,cur)}"><div class="dbar ${v===0?'zero':budgetDay&&v>budgetDay?'over':''}" style="height:${Math.max(2,v/max*100)}%"></div></div>`; }).join('')}</div>
      <div class="dlbls">${days.map(d=>`<div class="dlbl ${d===today()?'today':''}">${parseDay(d).getDate()}</div>`).join('')}</div></div></div></div>`;
  }
  const members=tr.members||[];
  if(members.length>1){
    const b=balances(spend); const mx=Math.max(...members.map(m=>b[m.id]?.paid||0))||1;
    h+=`<div class="card"><h4>${t('who_paid')}</h4><div class="cat-bars">${members.map(m=>`<div class="cb">${av(m,'md')}<div class="cb-mid"><div class="cb-top"><span>${esc(m.name)}</span><span>${fmt(b[m.id]?.paid||0,cur)}</span></div><div class="track"><i style="width:${(b[m.id]?.paid||0)/mx*100}%;background:${esc(m.color||'#14b8a6')}"></i></div></div></div>`).join('')}</div></div>`;
  }
  $('pane').innerHTML=h;
}

async function openExpense(id){
  const tr=S.trip, e = id ? S.exps.find(x=>x.id===id) : null;
  if(e && e.is_transfer){ if(await ask(t('transfer'), t('del_exp_q'), t('delete'), true)) deleteExpense(id); return; }
  const members=tr.members||[];
  const defSplit = Object.fromEntries(members.map(m=>[m.id,1]));
  S.ed = e ? { id:e.id, amountStr:String(Number(e.amount)).replace(/\.0+$/,''), currency:e.currency||tr.currency, rate:Number(e.rate)||1, rateAuto:false, category:e.category,
               date:String(e.date).slice(0,10), note:e.note||'', paid_by:e.paid_by||tr.my_member_id, split:{...(e.split||{[e.paid_by]:1})}, receipt:undefined, has_receipt:e.has_receipt, custom:false }
           : { amountStr:'0', currency:LS.raw('triply_lastcur_'+tr.id)||tr.currency, rate:1, rateAuto:true, category:null, date:defaultDate(), note:'', paid_by:tr.my_member_id, split:defSplit, receipt:undefined, custom:false };
  if(Object.values(S.ed.split).some(w=>Number(w)!==1)) S.ed.custom=true;

function edRenderAmt(){ const s=S.ed.amountStr, el=$('ed-amt'); const [a,b]=s.split('.'); const ip=Number(a).toLocaleString(LOC());
  el.textContent = ip + (b!==undefined ? (LANG==='nl'?',':'.')+b : ''); el.classList.toggle('zero', s==='0'); edRenderConv(); }
function edKey(k){
  let s=S.ed.amountStr; buzz();
  if(k==='⌫') s=s.length>1?s.slice(0,-1):'0';
  else if(k===','){ if(!s.includes('.')) s+='.'; }
  else { if(s==='0') s=k; else if(s.includes('.')&&s.split('.')[1].length>=2) return; else if(s.replace('.','').length>=9) return; else s+=k; }
  S.ed.amountStr=s; edRenderAmt(); if($('ed-split')) edRenderSplit();

async function edCur(c, keepRate){

  if(!keepRate){ S.ed.rate=null; S.ed.rateAuto=true; edRenderConv(); const r=await rateFor(c,tr.currency); if(S.ed && S.ed.currency===c && S.ed.rateAuto){ S.ed.rate=r; edRenderConv(); } }
  else edRenderConv();

async function saveExpense(){
  const ed=S.ed, tr=S.trip, amount=parseFloat(ed.amountStr);
  if(!amount||amount<=0) return toast(t('enter_amount'),'err');
  if(!ed.category) return toast(t('pick_cat'),'err');
  if(ed.currency!==tr.currency && !ed.rate) return toast(t('need_rate'),'err');
  const multi=(tr.members||[]).length>1;
  if(multi && !Object.keys(ed.split).length) return toast(t('pick_split'),'err');
  const body={ amount, currency:ed.currency, rate:ed.currency===tr.currency?1:ed.rate, category:ed.category, date:ed.date, note:$('ed-note').value.trim(),
               paid_by:ed.paid_by, split: multi ? ed.split : null };
  if(ed.receipt!==undefined) body.receipt=ed.receipt;
  try{ localStorage.setItem('triply_lastcur_'+tr.id, ed.currency); }catch(e){}
  const btn=$('ed-save'); btn.disabled=true; btn.innerHTML=t('saving');
  try{
    if(ed.id){ await api('/api/expenses/'+ed.id,{method:'PATCH',body}); }
    else { body.client_id=uid(); try{ await api('/api/trips/'+tr.id+'/expenses',{method:'POST',body}); }
      catch(e){ if(!e.network) throw e; S.outbox.push({trip_id:tr.id, body}); saveOutbox(); closeSheet(); buzz(); toast(t('saved_offline')); renderTrip(); return; } }
    closeSheet(); buzz(); toast(t('saved')); refreshTrip();
  }catch(e){ btn.disabled=false; btn.innerHTML=ic('i-check','s18')+t('save'); if(e.network) toast(t('offline_only_add'),'err'); }
}
async function deleteExpense(id){
  if(!await ask(t('delete'), t('del_exp_q'), t('delete'), true)) return;
  try{ await api('/api/expenses/'+id,{method:'DELETE'}); closeSheet(); toast(t('deleted')); refreshTrip(); }
  catch(e){ if(e.network) toast(t('offline_only_add'),'err'); }
}
// offline wachtrij versturen
let syncing=false;
async function syncOutbox(){
  if(syncing || !S.outbox.length || !TOKEN) return; syncing=true; let n=0;
  try{
    while(S.outbox.length){ const op=S.outbox[0];
      try{ await api('/api/trips/'+op.trip_id+'/expenses',{method:'POST',body:op.body,quiet:true}); n++; S.outbox.shift(); saveOutbox(); }
      catch(e){ if(e.network) break; S.outbox.shift(); saveOutbox(); } }
  } finally { syncing=false; }
  if(n){ toast(n===1?t('synced1'):t('synced',{n})); if(S.trip) refreshTrip(); else refreshHome(); }
}

function exportCSV(){

    <div class="field" style="margin-bottom:10px">${ic('i-users','s18')}<input id="s-name" maxlength="40" value="${esc(a.name||'')}" onchange="saveMe({name:this.value.trim()})"></div>
    <div class="field">${ic('c-cash','s18')}<select onchange="saveMe({home_currency:this.value})">${curOptions(a.home_currency||'EUR')}</select>${ic('i-chev','s16')}</div><div class="hint">${t('home_cur')}</div></div>
  <div class="grp"><div class="lbl">${t('language')}</div><div class="seg">${[['nl','Nederlands'],['en','English']].map(([l,n])=>`<button class="${LANG===l?'on':''}" onclick="setLang('${l}');$('set-body').innerHTML=settingsBody();$('sheet').querySelector('h2').textContent=t('settings');rerender()">${n}</button>`).join('')}</div></div>
  <div class="grp"><div class="lbl">${t('devices')}</div><div class="set-list">${devs.map(d=>`<div class="set-row"><span class="set-ico">${ic('i-phone','s16')}</span><span class="set-mid"><span class="set-t">${esc(d.label||'Toestel')}${d.current?` <span class="badge">${t('this_device')}</span>`:''}</span><span class="set-s">${t('last_seen',{d:relTime(d.last_seen)})}</span></span>${d.current?'':`<button class="sbtn danger" onclick="removeDevice('${esc(d.id)}')">${ic('i-trash','s16')}</button>`}</div>`).join('')}
    <button class="set-row" style="width:100%;text-align:left" onclick="linkNew()"><span class="set-ico" style="color:var(--teal-dk)">${ic('i-plus','s16')}</span><span class="set-mid"><span class="set-t" style="color:var(--teal-dk)">${t('link_new')}</span></span></button></div><div id="link-box"></div></div>
  <div class="grp"><div class="lbl">${t('security')}</div><div class="set-list">
    <button class="set-row" style="width:100%;text-align:left" onclick="newRecovery()"><span class="set-ico">${ic('i-key','s16')}</span><span class="set-mid"><span class="set-t">${t('new_recovery')}</span></span>${ic('i-chev-r','s16')}</button></div></div>
  <div class="grp"><div class="lbl">${t('legacy')}</div><div class="hint" style="margin:0 0 8px">${t('legacy_s')}</div><div style="display:flex;gap:8px"><div class="field" style="flex:1">${ic('i-history','s18')}<input id="s-legacy" placeholder="${t('legacy_ph')}" autocapitalize="off" autocomplete="off"></div><button class="sbtn dark" onclick="claimLegacy()">${t('claim')}</button></div></div>
  <button class="btn danger" onclick="signOut()">${ic('i-logout','s18')}${t('signout')}</button>
  <div class="foot"><div class="brand-mark">${ic('t-palm','s18')}</div><b style="color:var(--navy)">Triply</b> 2.0<br>${t('tagline')}</div>`;
}
function rerender(){ fmtsReset(); if($('v-trip').classList.contains('active')&&S.trip) renderTrip(); else renderHome(); }
function fmtsReset(){ for(const k in fmts) delete fmts[k]; }
async function saveMe(b){ if(b.name==='') return; try{ S.account=await api('/api/me',{method:'PATCH',body:b}); LS.set('c_account',S.account); toast(t('saved')); renderHome(); }catch(e){} }
let linkTimer;
async function linkNew(){
  try{ const r=await api('/api/me/link-code',{method:'POST'}); const url=location.origin+'/?link='+r.code.replace('-','');
    $('link-box').innerHTML=`<div class="invite" style="margin-top:10px"><div class="hint" style="color:rgba(255,255,255,.7);margin:0 0 8px">${t('link_new_s')}</div><div class="code-big">${esc(r.code)}</div><div class="hint" style="color:var(--sand);margin:6px 0 0" id="link-cd"></div><div class="qr hidden" id="link-qr"></div><div class="hint" style="color:rgba(255,255,255,.55);margin-top:10px">${t('ios_hint')}</div></div>`;
    drawQR($('link-qr'), url);
    clearInterval(linkTimer); const end=new Date(r.expires_at).getTime();
    linkTimer=setInterval(()=>{ const el=$('link-cd'); if(!el){ clearInterval(linkTimer); return; } const s=Math.max(0,Math.round((end-Date.now())/1000)); el.textContent=`${Math.floor(s/60)}:${pad(s%60)}`; if(!s){ clearInterval(linkTimer); $('link-box').innerHTML=''; } },1000);
  }catch(e){}
}
async function removeDevice(id){ if(!await ask(t('remove'), t('remove_dev_q'), t('remove'), true)) return;
  try{ await api('/api/me/devices/'+id,{method:'DELETE'}); S.devices=S.devices.filter(d=>d.id!==id); $('set-body').innerHTML=settingsBody(); }catch(e){} }
async function newRecovery(){ if(!await ask(t('new_recovery'), t('new_recovery_q'), t('next'))) return;
  try{ const r=await api('/api/me/recovery',{method:'POST'}); showRecovery(r.recovery_key); }catch(e){} }
async function claimLegacy(){ const c=$('s-legacy').value.trim(); if(c.length<3) return toast(t('code_req'),'err');
  try{ const r=await api('/api/me/claim',{method:'POST',body:{user_code:c}}); toast(r.claimed?t('claimed',{n:r.claimed}):t('claimed0'), r.claimed?'ok':'err'); $('s-legacy').value=''; if(r.claimed) refreshHome(); }catch(e){} }
async function signOut(){
  if(!await ask(t('signout'), t('signout_q'), t('signout'), true)) return;
  const me=(S.devices||[]).find(d=>d.current);
  try{ if(me) await api('/api/me/devices/'+me.id,{method:'DELETE',quiet:true}); }catch(e){}
  try{ Object.keys(localStorage).filter(k=>k.startsWith('c_')||k.startsWith('triply_')).forEach(k=>{ if(k!=='triply_lang') localStorage.removeItem(k); }); }catch(e){}
  location.replace(location.pathname);
}

/* ════════════════ BOOT ════════════════ */
(function boot(){
  setLang(LANG);
  const p=new URLSearchParams(location.search);
  if(p.get('join')) S.pendingJoin=p.get('join');
  if(p.get('link')) S.pendingLink=p.get('link');
  if(p.get('trip')) S.pendingTrip=p.get('trip');
  if(S.pendingJoin||S.pendingLink) history.replaceState(null,'',location.pathname);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  if(!TOKEN){ showOnb(S.pendingLink?'link':'start'); return; }
  startApp();
})();
</script>
</body>
</html>
